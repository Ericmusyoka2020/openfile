
<!DOCTYPE html>
<html>
<head>
  <title>View Document</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: Arial;
    }

    .box {
      text-align: center;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #2575fc;
      cursor: pointer;
    }

    .hand {
      display: block;
      margin-top: 8px;
      font-size: 25px;
    }
  </style>
</head>
<body>

  <div class="box">
    <button onclick="window.open('pic.png', '_blank')">
      View Document
    </button>
    <span class="hand">👆</span>
  </div>

</body>
</html>
