<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Documents</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      text-align: center;
    }

    .box {
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 25px;
    }

    button {
      display: block;
      width: 220px;
      margin: 12px auto;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #2575fc;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    .hand {
      font-size: 25px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>📄 View Documents</h1>
    <p>Choose a document to open</p>

    <button onclick="window.open('bb.pdf', '_blank')">
      📄 Open CV
    </button>

    <button onclick="window.open('pic.png', '_blank')">
      🎓 Open Certificates
    </button>

    <div class="hand">👇</div>
  </div>

</body>
</html>
